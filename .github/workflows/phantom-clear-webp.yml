name: Prepare Phantom D high-quality WebP
on:
  push:
    paths:
      - '.github/workflows/phantom-clear-webp.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convert validated AVIF into WebP for broad browser support
        run: |
          python -m pip install --quiet Pillow pillow-avif-plugin
          python - <<'PY'
          import pillow_avif
          from PIL import Image
          with Image.open('phantom-clear-hq.avif') as im:
              im.load()
              assert im.size == (1122, 1402), im.size
              im.convert('RGB').save('phantom-clear-hq.webp', 'WEBP', quality=88, method=6)
          with Image.open('phantom-clear-hq.webp') as im:
              im.verify()
          PY
      - name: Commit converted image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phantom-clear-hq.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets: add full-resolution Phantom D WebP for mobile"
            git push
          fi
